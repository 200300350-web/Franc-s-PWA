<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Práctica de Francés - Estilo Duolingo</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json;utf-8,{"name":"Francés Unicaribe","short_name":"Francés UC","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#002B5C","icons":[{"src":"https://placehold.co/192x192/002B5C/white?text=FR","sizes":"192x192","type":"image/png"},{"src":"https://placehold.co/512x512/002B5C/white?text=FR","sizes":"512x512","type":"image/png"}]}'>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS with Custom Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        uc: {
                            navy: '#002B5C',
                            'navy-dark': '#001A38',
                            turquoise: '#00A9E0',
                            'turquoise-dark': '#0085B2',
                            'turquoise-light': '#E5F6FD',
                            green: '#84BD00',
                            'green-dark': '#659000',
                            'green-light': '#F2F8E5',
                            red: '#ff4b4b',
                            'red-dark': '#ea2b2b',
                            'red-light': '#ffdfe0',
                            gray: '#e5e5e5',
                            'gray-dark': '#afafaf',
                            text: '#333333'
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'], // Duolingo style font
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Nunito', sans-serif; }
        
        /* 3D Button Push Effect */
        .btn-3d {
            transition: all 0.1s;
            position: relative;
            top: 0;
        }
        .btn-3d:active:not(:disabled) {
            top: 4px;
            border-bottom-width: 0px !important;
            margin-bottom: 4px;
        }
        
        /* Option Button specifically */
        .btn-option {
            transition: all 0.1s;
        }
        .btn-option.selected {
            background-color: #ddf4ff;
            border-color: #1cb0f6;
            color: #1cb0f6;
        }

        /* Slide Up Drawer */
        .drawer {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drawer.open {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-white text-uc-text h-screen flex flex-col overflow-hidden selection:bg-uc-turquoise-light">

    <!-- SCREEN 1: HOME / CATEGORY SELECTION -->
    <div id="screen-home" class="flex flex-col h-full max-w-md mx-auto w-full p-4 fade-in">
        <header class="flex items-center justify-between py-4 mb-4 border-b-2 border-uc-gray">
            <h1 class="text-2xl font-extrabold text-uc-navy tracking-wide">
                <i class="fa-solid fa-earth-americas mr-2"></i>Francés UC
            </h1>
            <div class="text-uc-turquoise font-bold">
                <i class="fa-solid fa-fire text-orange-400"></i> PWA
            </div>
        </header>

        <h2 class="text-xl font-bold mb-6 text-center">¿Qué quieres aprender hoy?</h2>

        <div id="category-list" class="flex flex-col gap-4 overflow-y-auto pb-6">
            <!-- Categories injected here -->
        </div>
    </div>

    <!-- SCREEN 2: LESSON -->
    <div id="screen-lesson" class="hidden flex-col h-full max-w-md mx-auto w-full relative">
        
        <!-- Header: Close & Progress -->
        <header class="flex items-center justify-between p-4 gap-4 z-10 bg-white">
            <button id="btn-quit" class="text-uc-gray-dark hover:text-gray-600 text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex-1 bg-uc-gray h-4 rounded-full overflow-hidden relative">
                <div id="progress-bar" class="bg-uc-turquoise h-full rounded-full w-0 transition-all duration-300 absolute left-0 top-0">
                    <!-- Light glare effect on progress bar -->
                    <div class="w-full h-1/3 bg-white opacity-20 absolute top-1 left-0 rounded-full"></div>
                </div>
            </div>
        </header>

        <!-- Question Area -->
        <main class="flex-1 flex flex-col p-4 overflow-y-auto pb-32">
            <h2 class="text-2xl font-bold mb-6">Traduce esta palabra</h2>
            
            <div class="flex items-center gap-4 mb-8">
                <!-- Character Avatar (Placeholder Unicaribe) -->
                <div class="w-20 h-20 bg-uc-turquoise-light rounded-full border-4 border-uc-gray flex items-center justify-center text-4xl">
                    🐬
                </div>
                <!-- Speech Bubble -->
                <div class="relative bg-white border-2 border-uc-gray rounded-2xl p-4 shadow-sm flex-1">
                    <!-- Arrow -->
                    <div class="absolute w-4 h-4 bg-white border-l-2 border-b-2 border-uc-gray transform rotate-45 -left-[10px] top-6"></div>
                    <span id="question-text" class="text-xl font-bold text-gray-800 block">Bonjour</span>
                </div>
            </div>

            <!-- 2x2 Options Grid -->
            <div id="options-grid" class="grid grid-cols-2 gap-3 mt-auto">
                <!-- Buttons injected here via JS -->
            </div>
        </main>

        <!-- Bottom Feedback Drawer -->
        <div id="feedback-drawer" class="drawer absolute bottom-0 left-0 w-full p-4 border-t-2 bg-white flex flex-col gap-4 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
            <div id="feedback-content" class="flex items-center gap-3">
                <div id="feedback-icon" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl bg-white shadow-sm">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="flex-1">
                    <h3 id="feedback-title" class="text-2xl font-extrabold mb-1">¡Correcto!</h3>
                    <p id="feedback-subtitle" class="text-sm font-bold opacity-80 hidden">La respuesta correcta es: <span id="correct-answer-text"></span></p>
                </div>
            </div>
            <button id="btn-continue" class="btn-3d w-full py-3 rounded-2xl font-extrabold text-white text-lg border-b-[4px] uppercase tracking-wide">
                Continuar
            </button>
        </div>
    </div>

    <!-- SCREEN 3: LESSON COMPLETE -->
    <div id="screen-complete" class="hidden flex-col h-full max-w-md mx-auto w-full p-4 justify-center items-center text-center">
        <div class="text-6xl mb-6">🎉</div>
        <h2 class="text-3xl font-extrabold text-uc-navy mb-4">¡Lección completada!</h2>
        <p class="text-lg font-bold text-gray-500 mb-12">Has practicado todas las palabras de esta categoría.</p>
        
        <div class="flex gap-4 w-full">
            <button id="btn-home" class="btn-3d flex-1 py-4 bg-uc-turquoise border-uc-turquoise-dark border-b-[4px] rounded-2xl font-extrabold text-white text-lg uppercase tracking-wide">
                Inicio
            </button>
        </div>
    </div>

    <script>
        // --- 1. Data Structure ---
        const vocabData = new Map([
            ['Présentation', new Map([
                ["Je m'appelle", "Me llamo"],
                ["J'habite", "Vivo"],
                ["Je viens de...", "Vengo de..."],
                ["J'ai... ans", "Tengo... años"],
                ["Je parle...", "Hablo..."],
                ["J'étudie", "Estudio"],
                ["Je travaille", "Trabajo"],
                ["J'aime...", "Me gusta..."]
            ])],
            ['Inscription', new Map([
                ["nom", "apellido"],
                ["prénom", "nombre"],
                ["numéro de téléphone", "número de teléfono"],
                ["courriel", "correo electrónico"],
                ["pays d'origine", "país de origen"],
                ["adresse", "dirección"],
                ["nationalité", "nacionalidad"],
                ["date de naissance", "fecha de nacimiento"]
            ])],
            ['Localiser', new Map([
                ["continuer", "continuar"],
                ["marcher", "caminar"],
                ["prendre", "tomar"],
                ["tourner", "girar"],
                ["monter", "subir"],
                ["descendre", "bajar"],
                ["à gauche", "a la izquierda"],
                ["à droite", "a la derecha"],
                ["tout droit", "todo recto"],
                ["près", "cerca"],
                ["loin", "lejos"],
                ["le musée", "el museo"],
                ["la rue", "la calle"],
                ["le métro", "el metro"]
            ])],
            ["L'hébergement", new Map([
                ["le frigo", "el refrigerador"],
                ["le canapé", "el sofá"],
                ["la chaise", "la silla"],
                ["la table", "la mesa"],
                ["le lit", "la cama"],
                ["la chambre", "la habitación"],
                ["la cuisine", "la cocina"],
                ["la salle de bain", "el baño"]
            ])],
            ['Questions', new Map([
                ["Comment?", "¿Cómo?"],
                ["Où?", "¿Dónde?"],
                ["Quand?", "¿Cuándo?"],
                ["Pourquoi?", "¿Por qué?"],
                ["Avec qui?", "¿Con quién?"],
                ["Quel", "¿Cuál?"]
            ])]
        ]);

        // Global pool for wrong options
        const globalVocabArray = [];
        vocabData.forEach((categoryMap) => {
            globalVocabArray.push(...Array.from(categoryMap.entries()));
        });

        // --- 2. DOM Elements ---
        const screenHome = document.getElementById('screen-home');
        const screenLesson = document.getElementById('screen-lesson');
        const screenComplete = document.getElementById('screen-complete');
        
        const categoryList = document.getElementById('category-list');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        
        const drawer = document.getElementById('feedback-drawer');
        const btnContinue = document.getElementById('btn-continue');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackSubtitle = document.getElementById('feedback-subtitle');
        const correctAnswerText = document.getElementById('correct-answer-text');
        
        const btnQuit = document.getElementById('btn-quit');
        const btnHome = document.getElementById('btn-home');

        // --- 3. App State ---
        let lessonQueue = [];
        let totalUniqueQuestions = 0;
        let currentPair = null;
        let isAnswerSubmitted = false;

        // --- 4. Initialization ---
        function initApp() {
            // Render Categories
            const icons = ['fa-hand-wave', 'fa-pen-to-square', 'fa-map-location-dot', 'fa-house', 'fa-circle-question'];
            let i = 0;
            vocabData.forEach((_, categoryName) => {
                const btn = document.createElement('button');
                btn.className = 'btn-3d w-full p-4 bg-white border-2 border-uc-gray border-b-[4px] rounded-2xl flex items-center justify-between text-left active:bg-gray-50';
                btn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-uc-navy text-white rounded-full flex items-center justify-center text-xl font-bold shadow-sm">
                            <i class="fa-solid ${icons[i] || 'fa-star'}"></i>
                        </div>
                        <div>
                            <h3 class="font-extrabold text-lg">${categoryName}</h3>
                            <p class="text-sm text-gray-500 font-bold">${vocabData.get(categoryName).size} palabras</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-uc-gray-dark"></i>
                `;
                btn.onclick = () => startLesson(categoryName);
                categoryList.appendChild(btn);
                i++;
            });
        }

        // --- 5. Logic: Lesson Flow ---
        function startLesson(categoryName) {
            const categoryData = Array.from(vocabData.get(categoryName).entries());
            lessonQueue = shuffleArray([...categoryData]);
            totalUniqueQuestions = lessonQueue.length;
            
            updateProgress();
            
            screenHome.classList.add('hidden');
            screenHome.classList.remove('flex');
            screenLesson.classList.remove('hidden');
            screenLesson.classList.add('flex');
            
            nextQuestion();
        }

        function updateProgress() {
            // Progress based on how many unique questions have been successfully answered
            const remaining = lessonQueue.length;
            // If we re-add questions, remaining can exceed totalUniqueQuestions momentarily, 
            // so we cap the progress display logic.
            const completed = Math.max(0, totalUniqueQuestions - remaining);
            const percentage = (completed / totalUniqueQuestions) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        function nextQuestion() {
            if (lessonQueue.length === 0) {
                finishLesson();
                return;
            }

            // Close drawer
            drawer.classList.remove('open');
            isAnswerSubmitted = false;

            // Get next question
            currentPair = lessonQueue.shift(); // Remove from front
            const [frWord, esTranslation] = currentPair;

            questionText.textContent = frWord;

            // Generate options (1 correct, 3 random wrong from global pool)
            let options = [esTranslation];
            while (options.length < 4) {
                const randomPair = globalVocabArray[Math.floor(Math.random() * globalVocabArray.length)];
                const wrongEsTranslation = randomPair[1];
                if (!options.includes(wrongEsTranslation)) {
                    options.push(wrongEsTranslation);
                }
            }

            options = shuffleArray(options);

            // Render options grid
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option bg-white border-2 border-uc-gray border-b-[4px] rounded-xl p-4 text-center font-bold text-gray-700 active:translate-y-1 active:border-b-0 hover:bg-gray-50 flex items-center justify-center min-h-[80px]';
                btn.textContent = opt;
                btn.onclick = () => selectOption(btn, opt);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(btnElement, selectedAnswer) {
            if (isAnswerSubmitted) return;
            
            // Highlight selection temporarily (optional, here we immediately submit for faster flow like some Duolingo exercises, 
            // but let's do immediate check for simplicity)
            checkAnswer(btnElement, selectedAnswer);
        }

        function checkAnswer(btnElement, selectedAnswer) {
            isAnswerSubmitted = true;
            const isCorrect = selectedAnswer === currentPair[1];

            // Disable all buttons
            const allBtns = optionsGrid.querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('active:translate-y-1', 'active:border-b-0', 'hover:bg-gray-50');
            });

            // Show Drawer
            drawer.classList.add('open');

            if (isCorrect) {
                // UI changes for correct
                btnElement.classList.replace('border-uc-gray', 'border-uc-green-dark');
                btnElement.classList.replace('bg-white', 'bg-uc-green-light');
                btnElement.classList.replace('text-gray-700', 'text-uc-green-dark');

                drawer.classList.remove('bg-uc-red-light', 'border-uc-red');
                drawer.classList.add('bg-uc-green-light', 'border-uc-green');
                
                feedbackIcon.innerHTML = '<i class="fa-solid fa-check text-uc-green-dark"></i>';
                feedbackTitle.textContent = '¡Excelente!';
                feedbackTitle.className = 'text-2xl font-extrabold mb-1 text-uc-green-dark';
                feedbackSubtitle.classList.add('hidden');

                btnContinue.className = 'btn-3d w-full py-3 rounded-2xl font-extrabold text-white text-lg border-b-[4px] uppercase tracking-wide bg-uc-green border-uc-green-dark';
                
                updateProgress();
            } else {
                // Logic: Re-add to queue (spaced repetition)
                lessonQueue.push(currentPair);

                // UI changes for incorrect
                btnElement.classList.replace('border-uc-gray', 'border-uc-red-dark');
                btnElement.classList.replace('bg-white', 'bg-uc-red-light');
                btnElement.classList.replace('text-gray-700', 'text-uc-red');

                // Find and highlight correct option
                allBtns.forEach(b => {
                    if (b.textContent === currentPair[1]) {
                        b.classList.replace('border-uc-gray', 'border-uc-green-dark');
                        b.classList.replace('bg-white', 'bg-uc-green-light');
                        b.classList.replace('text-gray-700', 'text-uc-green-dark');
                    }
                });

                drawer.classList.remove('bg-uc-green-light', 'border-uc-green');
                drawer.classList.add('bg-uc-red-light', 'border-uc-red');
                
                feedbackIcon.innerHTML = '<i class="fa-solid fa-xmark text-uc-red"></i>';
                feedbackTitle.textContent = '¡Respuesta incorrecta!';
                feedbackTitle.className = 'text-2xl font-extrabold mb-1 text-uc-red';
                
                feedbackSubtitle.classList.remove('hidden');
                feedbackSubtitle.className = 'text-sm font-bold text-uc-red opacity-90';
                correctAnswerText.textContent = currentPair[1];

                btnContinue.className = 'btn-3d w-full py-3 rounded-2xl font-extrabold text-white text-lg border-b-[4px] uppercase tracking-wide bg-uc-red border-uc-red-dark';
            }
        }

        function finishLesson() {
            progressBar.style.width = '100%';
            setTimeout(() => {
                screenLesson.classList.add('hidden');
                screenLesson.classList.remove('flex');
                screenComplete.classList.remove('hidden');
                screenComplete.classList.add('flex');
            }, 300);
        }

        // --- 6. Utilities & Events ---
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        btnContinue.addEventListener('click', () => {
            if(drawer.classList.contains('open')) {
                nextQuestion();
            }
        });

        // Quit lesson
        btnQuit.addEventListener('click', () => {
            if(confirm('¿Seguro que quieres salir? Perderás tu progreso.')) {
                screenLesson.classList.add('hidden');
                screenLesson.classList.remove('flex');
                screenHome.classList.remove('hidden');
                screenHome.classList.add('flex');
            }
        });

        // Go home from finish screen
        btnHome.addEventListener('click', () => {
            screenComplete.classList.add('hidden');
            screenComplete.classList.remove('flex');
            screenHome.classList.remove('hidden');
            screenHome.classList.add('flex');
        });

        // Start
        initApp();

        // PWA Service Worker Stub
        if ('serviceWorker' in navigator) {
            // Stub to make it installable if served from a server
            // navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
